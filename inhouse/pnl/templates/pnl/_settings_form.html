<section id="id-pnl-settings-form">
  <form hx-post="{% url 'pnl_settings' path %}?{{ query }}" hx-target="#id-pnl-settings-form" hx-swap="outerHTML">
    {% if features.cost_methods|length > 1 %}
    <h2>Cost basis</h2>
    <label>Method
      <select name="cost_method">
        {% for key, label in pnl_settings.COST_METHOD_CHOICES %}{% if key in features.cost_methods %}<option value="{{ key }}"{% if key == pnl_settings.cost_method %} selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}
      </select>
    </label>
    {% endif %}
    {% if features.report %}
    <h2>PDF report</h2>
    <label>Page size
      <select name="page_format">
        {% for key, label in pnl_settings.PAGE_FORMAT_CHOICES %}<option value="{{ key }}"{% if key == pnl_settings.page_format %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    {% endif %}
    {% if features.export %}
    <h2>CSV export</h2>
    <label>Separator
      <select name="csv_separator">
        {% for key, label in pnl_settings.SEPARATOR_CHOICES %}<option value="{{ key }}"{% if key == pnl_settings.csv_separator %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    {% endif %}
    <button type="submit" class="pnl-button">Save</button>
    {% if saved %}<span class="pnl-muted" role="status">Saved.</span>{% endif %}
  </form>
</section>
