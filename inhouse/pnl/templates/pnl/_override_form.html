{# The reader's cost for a deposit (kind "basis") or value for an asset; a saved figure redirects the page. #}
<details class="pnl-override"><summary title="{{ title }}">{% if override %}{{ change_label }}{% else %}{{ set_label }}{% endif %}</summary>
<form hx-post="{% url 'pnl_override' path asset %}?{{ query }}" hx-target="find .pnl-override-error" hx-swap="outerHTML"><input type="hidden" name="kind" value="{{ kind }}">{% if event %}<input type="hidden" name="event" value="{{ event }}">{% endif %}<label>{{ amount_label }} <input type="number" name="amount" min="0" step="any" required inputmode="decimal" value="{{ override.amount_text|default:'' }}"></label> <select name="currency" aria-label="Currency">{% for code in features.currencies %}<option value="{{ code }}"{% if override and override.currency == code or not override and code == currency %} selected{% endif %}>{{ code|upper }}</option>{% endfor %}</select> <button type="submit" class="pnl-alert-option">Save</button><span class="pnl-override-error"></span></form>
{% if override %}<form hx-post="{% url 'pnl_override' path asset %}?{{ query }}" hx-swap="none"><input type="hidden" name="kind" value="{{ kind }}">{% if event %}<input type="hidden" name="event" value="{{ event }}">{% endif %}<input type="hidden" name="remove" value="1"><button type="submit" class="pnl-link pnl-hide">{{ remove_label }}</button></form>{% endif %}
</details>
