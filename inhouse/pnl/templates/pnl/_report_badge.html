{# id-pnl-report-badge: polls (outerHTML) on the other tabs until the report the reader asked for is ready. #}
{% if report == "ready" %}<span id="id-pnl-report-badge" class="pnl-badge pnl-badge-illiquid" role="status">PDF ready</span>{% elif report == "checking" or report == "preparing" %}<span id="id-pnl-report-badge" class="pnl-badge pnl-badge-muted" role="status" hx-get="{% url 'pnl_report' path %}?{{ query }}{% if full %}&amp;full=1{% endif %}&amp;badge=1" hx-trigger="load{% if report == "preparing" %} delay:4s{% endif %}" hx-swap="outerHTML">Preparing PDF</span>{% endif %}
